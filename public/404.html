<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Oops! 404</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Comic Sans MS', sans-serif;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #333;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1.25rem;
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        a {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        a:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="emoji">🕵️‍♀️</div>
    <h1>404 - Page Not Found</h1>
    <p>We sent a team of highly trained ferrets to investigate.<br>They came back confused.</p>
    <a href="/">Go Home Before They Come Back 🏠</a>
</div>
</body>
</html>
