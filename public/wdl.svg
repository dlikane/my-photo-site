<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <defs>
        <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#41D1FF"/>
            <stop offset="100%" stop-color="#BD34FE"/>
        </linearGradient>
        <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFEA83"/>
            <stop offset="8.333%" stop-color="#FFDD35"/>
            <stop offset="100%" stop-color="#FFA800"/>
        </linearGradient>
    </defs>

    <!-- Transparent background -->
    <rect width="100%" height="100%" fill="none"/>

    <!-- W Path -->
    <path d="M40,180 L60,80 L80,160 L100,80 L120,180" fill="none" stroke="url(#gradient1)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- D Path (more regular curve for middle stroke match) -->
    <path d="M130,80 Q200,100 150,180 T130,80" fill="none" stroke="url(#gradient2)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- L Path -->
    <path d="M190,80 L190,180 L230,180" fill="none" stroke="url(#gradient1)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
